long-description: |
  Source-only restart of Rahul Bhagwat's PLL from Intubun/chipalooza_lvds_pll.
  Includes Xschem analog schematics, digital RTL, behavioral models, and
  simulation/characterization benches for the ihp-sg13cmos5l PDK.
  The standalone MPW interface and fresh manual layout are still to be built.
  No PLL DRC, LVS, PEX, timing, or tapeout sign-off is claimed.
  See docs/pll_restart.md for the physical-design sequence and open decisions.

